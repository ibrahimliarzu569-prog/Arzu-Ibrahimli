<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduRush</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #12141F;
    --surface: #1B1E2E;
    --surfaceAlt: #232842;
    --line: #2E3350;
    --text: #F5F3EE;
    --muted: #8B90A8;
    --mint: #4CE0B3;
    --amber: #FFB648;
    --red: #FF6B6B;
    --blue: #6FA8FF;
    --purple: #C792EA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .display { font-family: 'Space Grotesk', sans-serif; }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 48px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; cursor: pointer; border: none; }
  .hidden { display: none !important; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .logo { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: var(--mint); }
  .pills { display: flex; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .cardRow { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .xpbar { height: 8px; background: var(--surfaceAlt); border-radius: 999px; overflow: hidden; }
  .xpbar-fill { height: 100%; background: var(--mint); transition: width 0.5s ease; }

  .weakCard { background: var(--surfaceAlt); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); }
  .weakCard .label { font-size: 13px; color: var(--muted); }

  .subjTags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .subjTag { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--surfaceAlt); border: 1px solid var(--line); }

  .cta { width: 100%; padding: 18px; border-radius: 16px; background: linear-gradient(90deg, var(--mint), #35C39A); color: #0B1410; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; box-shadow: 0 8px 24px -8px rgba(76,224,179,0.5); }
  .cta:disabled { background: var(--surfaceAlt); color: var(--muted); box-shadow: none; }

  .track { display: flex; gap: 4px; margin-bottom: 20px; }
  .track-seg { flex: 1; height: 6px; border-radius: 999px; background: var(--surfaceAlt); transition: background 0.3s ease; }
  .track-seg.done { background: var(--mint); }
  .track-seg.current { background: var(--amber); }

  .qMeta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 12px; color: var(--muted); }
  .combo { font-size: 13px; font-weight: 700; color: var(--amber); }

  .subjRow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .subjLabel { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .timer { font-size: 13px; color: var(--muted); font-weight: 600; }
  .timer.low { color: var(--red); }

  .qCard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; margin-bottom: 20px; animation: pulseIn 0.25s ease; }
  .qText { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; line-height: 1.4; }

  .opts { display: flex; flex-direction: column; gap: 10px; }
  .optBtn { text-align: left; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 500; transition: all 0.15s ease; }
  .optBtn:hover:not(:disabled) { border-color: var(--mint); }
  .optBtn.correct { background: rgba(76,224,179,0.13); border-color: var(--mint); color: var(--mint); }
  .optBtn.wrong { background: rgba(255,107,107,0.13); border-color: var(--red); color: var(--red); }

  .resultsWrap { display: flex; flex-direction: column; flex: 1; text-align: center; }
  .resultEmoji { margin-top: 20px; margin-bottom: 8px; font-size: 40px; }
  .resultScore { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .resultSub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .statRow { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
  .statCard { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 8px; }
  .statCard .icon { font-size: 20px; margin-bottom: 4px; }
  .statCard .val { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }
  .statCard .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .comboLine { font-size: 13px; color: var(--amber); margin-bottom: 24px; }
  .backBtn { width: 100%; padding: 16px; border-radius: 16px; background: var(--surfaceAlt); color: var(--text); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }

  .spacer { flex: 1; }
  .errNote { font-size: 12px; color: var(--red); margin-top: 12px; text-align: center; }
  .loadingScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--muted); }

  @keyframes pulseIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
</style>
</head>
<body>

<div id="app"></div>

<script>
// ---------- Data ----------
const SUBJECTS = {
  math: { label: "Math", color: "var(--blue)" },
  english: { label: "English", color: "var(--purple)" },
  history: { label: "History", color: "var(--amber)" },
  geography: { label: "Geography", color: "var(--mint)" },
};

const BANK = [
  { id: 1, subject: "math", q: "What is 12 × 7?", opts: ["74", "84", "82", "94"], a: 1 },
  { id: 2, subject: "math", q: "What is the square root of 144?", opts: ["10", "11", "12", "13"], a: 2 },
  { id: 3, subject: "math", q: "What is 15% of 200?", opts: ["20", "25", "30", "35"], a: 2 },
  { id: 4, subject: "math", q: "Solve: 9 + 6 × 2", opts: ["30", "21", "18", "24"], a: 1 },
  { id: 5, subject: "math", q: "What is 3⁴?", opts: ["12", "64", "81", "27"], a: 2 },
  { id: 6, subject: "math", q: "How many sides does a hexagon have?", opts: ["5", "6", "7", "8"], a: 1 },
  { id: 7, subject: "math", q: "What is 100 ÷ 4?", opts: ["20", "25", "30", "40"], a: 1 },
  { id: 8, subject: "english", q: "What is the synonym of 'happy'?", opts: ["Sad", "Joyful", "Angry", "Tired"], a: 1 },
  { id: 9, subject: "english", q: "Choose the correctly spelled word:", opts: ["Recieve", "Receive", "Receeve", "Receve"], a: 1 },
  { id: 10, subject: "english", q: "What is the antonym of 'ancient'?", opts: ["Old", "Modern", "Historic", "Aged"], a: 1 },
  { id: 11, subject: "english", q: "Which word is a noun?", opts: ["Quickly", "Beautiful", "Freedom", "Run"], a: 2 },
  { id: 12, subject: "english", q: "Fill in: She ___ to school every day.", opts: ["go", "goes", "going", "gone"], a: 1 },
  { id: 13, subject: "english", q: "What is the plural of 'child'?", opts: ["Childs", "Childes", "Children", "Childrens"], a: 2 },
  { id: 14, subject: "english", q: "Which is a metaphor?", opts: ["Fast as lightning", "Time is money", "Like a lion", "As brave as a lion"], a: 1 },
  { id: 15, subject: "history", q: "Who was the first President of the USA?", opts: ["Lincoln", "Washington", "Jefferson", "Adams"], a: 1 },
  { id: 16, subject: "history", q: "In which year did World War II end?", opts: ["1943", "1944", "1945", "1946"], a: 2 },
  { id: 17, subject: "history", q: "Which ancient civilization built the pyramids of Giza?", opts: ["Romans", "Greeks", "Egyptians", "Mayans"], a: 2 },
  { id: 18, subject: "history", q: "The Berlin Wall fell in which year?", opts: ["1987", "1989", "1991", "1993"], a: 1 },
  { id: 19, subject: "history", q: "Who wrote the Declaration of Independence?", opts: ["Franklin", "Jefferson", "Washington", "Adams"], a: 1 },
  { id: 20, subject: "history", q: "The Great Wall was built to protect which country?", opts: ["Japan", "Korea", "China", "Mongolia"], a: 2 },
  { id: 21, subject: "geography", q: "What is the capital of Japan?", opts: ["Seoul", "Beijing", "Tokyo", "Bangkok"], a: 2 },
  { id: 22, subject: "geography", q: "Which is the longest river in the world?", opts: ["Amazon", "Nile", "Yangtze", "Mississippi"], a: 1 },
  { id: 23, subject: "geography", q: "Which continent is the Sahara Desert on?", opts: ["Asia", "Africa", "Australia", "South America"], a: 1 },
  { id: 24, subject: "geography", q: "What is the smallest country in the world?", opts: ["Monaco", "San Marino", "Vatican City", "Liechtenstein"], a: 2 },
  { id: 25, subject: "geography", q: "Which mountain range separates Europe and Asia?", opts: ["Alps", "Andes", "Ural", "Himalayas"], a: 2 },
  { id: 26, subject: "geography", q: "Which ocean is the largest?", opts: ["Atlantic", "Indian", "Arctic", "Pacific"], a: 3 },
  { id: 27, subject: "math", q: "What is the value of π rounded to 2 decimals?", opts: ["3.12", "3.14", "3.16", "3.18"], a: 1 },
  { id: 28, subject: "english", q: "What part of speech is 'quickly'?", opts: ["Noun", "Verb", "Adverb", "Adjective"], a: 2 },
];

const STORAGE_KEY = "edurush_progress";
const DEFAULT_PROGRESS = {
  xp: 0, coins: 0, streak: 0, lastPlayedDate: null,
  wrongCounts: { math: 0, english: 0, history: 0, geography: 0 },
  totalAnswered: 0, totalCorrect: 0,
};

function todayStr() { return new Date().toISOString().slice(0, 10); }
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...DEFAULT_PROGRESS, ...JSON.parse(raw) };
  } catch (e) {}
  return { ...DEFAULT_PROGRESS };
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); return true; }
  catch (e) { return false; }
}

function pickDailySet(wrongCounts) {
  const bySubject = {};
  Object.keys(SUBJECTS).forEach(s => bySubject[s] = BANK.filter(q => q.subject === s));
  const weighted = [];
  BANK.forEach(q => { const w = 1 + (wrongCounts[q.subject] || 0) * 2; for (let i = 0; i < w; i++) weighted.push(q); });
  const chosen = []; const used = new Set();
  Object.keys(SUBJECTS).forEach(s => {
    const pool = bySubject[s];
    if (pool.length) { const pick = pool[Math.floor(Math.random() * pool.length)]; chosen.push(pick); used.add(pick.id); }
  });
  let guard = 0;
  while (chosen.length < 10 && guard < 500) {
    guard++;
    const pick = weighted[Math.floor(Math.random() * weighted.length)];
    if (!used.has(pick.id)) { chosen.push(pick); used.add(pick.id); }
  }
  for (let i = chosen.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [chosen[i], chosen[j]] = [chosen[j], chosen[i]]; }
  return chosen.slice(0, 10);
}

function levelFromXp(xp) { return { level: Math.floor(xp / 100) + 1, into: xp % 100, need: 100 }; }

// ---------- State ----------
let progress = loadProgress();
let screen = "home";
let dailySet = [], qIndex = 0, selected = null, answers = [], combo = 0, maxCombo = 0, timeLeft = 10;
let timerHandle = null;
let saveError = false;

const app = document.getElementById("app");

function render() {
  if (screen === "home") renderHome();
  else if (screen === "quiz") renderQuiz();
  else if (screen === "results") renderResults();
}

function renderHome() {
  const { level, into, need } = levelFromXp(progress.xp);
  const playedToday = progress.lastPlayedDate === todayStr();
  const weakest = (() => {
    const entries = Object.entries(progress.wrongCounts);
    if (entries.every(([, v]) => v === 0)) return null;
    entries.sort((a, b) => b[1] - a[1]);
    return entries[0][0];
  })();

  app.innerHTML = `
    <div class="header">
      <div class="logo">Edu<span>Rush</span></div>
      <div class="pills">
        <div class="pill"><span>🪙</span><span style="color:var(--amber)">${progress.coins}</span></div>
        <div class="pill"><span>🔥</span><span style="color:var(--red)">${progress.streak}</span></div>
      </div>
    </div>

    <div class="card">
      <div class="cardRow">
        <span class="display" style="font-weight:700;font-size:18px">Level ${level}</span>
        <span style="color:var(--muted);font-size:13px">${into} / ${need} XP</span>
      </div>
      <div class="xpbar"><div class="xpbar-fill" style="width:${(into/need)*100}%"></div></div>
    </div>

    ${weakest ? `
    <div class="weakCard">
      <span style="font-size:20px">🎯</span>
      <div>
        <div class="label">Твоя слабая тема</div>
        <div style="font-weight:600;color:${SUBJECTS[weakest].color}">${SUBJECTS[weakest].label} — сегодня подтянем именно её</div>
      </div>
    </div>` : ""}

    <div class="spacer"></div>

    <div style="margin-bottom:20px">
      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Предметы в подборке</div>
      <div class="subjTags">
        ${Object.entries(SUBJECTS).map(([k,s]) => `<span class="subjTag" style="color:${s.color}">${s.label}</span>`).join("")}
      </div>
    </div>

    ${playedToday ? `
      <div style="text-align:center">
        <button class="cta" disabled>Возвращайся завтра ✓</button>
        <div style="font-size:13px;color:var(--muted);margin-top:10px">Ты уже прошёл(ла) сегодняшний раунд — так держать.</div>
      </div>
    ` : `
      <button class="cta" id="startBtn">Начать сегодняшний раунд ⚡</button>
    `}

    ${saveError ? `<div class="errNote">Не удалось сохранить прогресс — можно продолжать играть, но данные могут не сохраниться.</div>` : ""}
  `;

  const startBtn = document.getElementById("startBtn");
  if (startBtn) startBtn.addEventListener("click", startRush);
}

function startRush() {
  dailySet = pickDailySet(progress.wrongCounts);
  qIndex = 0; selected = null; answers = []; combo = 0; maxCombo = 0; timeLeft = 10;
  screen = "quiz";
  render();
  startTimer();
}

function startTimer() {
  clearInterval(timerHandle);
  timeLeft = 10;
  timerHandle = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(timerHandle);
      handleAnswer(-1);
    } else {
      updateTimerUI();
    }
  }, 1000);
}

function updateTimerUI() {
  const el = document.getElementById("timerVal");
  if (el) {
    el.textContent = "⏱ " + timeLeft + "s";
    el.className = "timer" + (timeLeft <= 3 ? " low" : "");
  }
}

function renderQuiz() {
  const current = dailySet[qIndex];
  const subj = SUBJECTS[current.subject];

  app.innerHTML = `
    <div class="track">
      ${dailySet.map((_, i) => `<div class="track-seg ${i < qIndex ? "done" : i === qIndex ? "current" : ""}"></div>`).join("")}
    </div>

    <div class="qMeta">
      <span>Вопрос ${qIndex + 1} из ${dailySet.length}</span>
      ${combo >= 2 ? `<span class="combo">🔥 x${combo} combo</span>` : ""}
    </div>

    <div class="subjRow">
      <span class="subjLabel" style="color:${subj.color}">${subj.label}</span>
      <span class="timer" id="timerVal">⏱ ${timeLeft}s</span>
    </div>

    <div class="qCard"><div class="qText">${current.q}</div></div>

    <div class="opts">
      ${current.opts.map((opt, i) => `<button class="optBtn" data-idx="${i}">${opt}</button>`).join("")}
    </div>
  `;

  document.querySelectorAll(".optBtn").forEach(btn => {
    btn.addEventListener("click", () => handleAnswer(parseInt(btn.dataset.idx)));
  });
}

function handleAnswer(optIndex) {
  if (selected !== null) return;
  clearInterval(timerHandle);
  const current = dailySet[qIndex];
  const isCorrect = optIndex === current.a;
  const fast = isCorrect && timeLeft >= 6;
  selected = optIndex;
  answers.push({ subject: current.subject, correct: isCorrect, fast });
  combo = isCorrect ? combo + 1 : 0;
  maxCombo = Math.max(maxCombo, combo);

  document.querySelectorAll(".optBtn").forEach(btn => {
    const i = parseInt(btn.dataset.idx);
    btn.disabled = true;
    if (i === current.a) btn.classList.add("correct");
    else if (i === optIndex) btn.classList.add("wrong");
  });

  setTimeout(() => {
    if (qIndex + 1 < dailySet.length) {
      qIndex++; selected = null;
      renderQuiz();
      startTimer();
    } else {
      finishRush();
    }
  }, 900);
}

function finishRush() {
  const correctCount = answers.filter(a => a.correct).length;
  const baseXp = correctCount * 10;
  const speedBonus = answers.filter(a => a.fast).length * 3;
  const comboBonus = maxCombo >= 3 ? maxCombo * 2 : 0;
  const xpGained = baseXp + speedBonus + comboBonus;
  const coinsGained = correctCount * 5 + (maxCombo >= 5 ? 10 : 0);

  const wrongCounts = { ...progress.wrongCounts };
  answers.forEach(a => { if (!a.correct) wrongCounts[a.subject] = (wrongCounts[a.subject] || 0) + 1; });

  let streak = progress.streak;
  if (progress.lastPlayedDate === yesterdayStr()) streak += 1;
  else if (progress.lastPlayedDate !== todayStr()) streak = 1;

  const prevLevel = levelFromXp(progress.xp).level;

  progress = {
    xp: progress.xp + xpGained,
    coins: progress.coins + coinsGained,
    streak, lastPlayedDate: todayStr(), wrongCounts,
    totalAnswered: progress.totalAnswered + answers.length,
    totalCorrect: progress.totalCorrect + correctCount,
  };
  saveError = !saveProgress(progress);

  window._lastRun = { correctCount, total: answers.length, xpGained, coinsGained, maxCombo, leveledUp: levelFromXp(progress.xp).level > prevLevel };
  screen = "results";
  render();
}

function renderResults() {
  const r = window._lastRun;
  const emoji = r.correctCount === r.total ? "🏆" : r.correctCount >= r.total * 0.6 ? "⚡" : "💪";

  app.innerHTML = `
    <div class="resultsWrap">
      <div class="resultEmoji">${emoji}</div>
      <div class="resultScore display">${r.correctCount} / ${r.total} правильно</div>
      <div class="resultSub">${r.leveledUp ? `Новый уровень: ${levelFromXp(progress.xp).level}!` : "Отличная работа — до встречи завтра."}</div>

      <div class="statRow">
        <div class="statCard"><div class="icon">⚡</div><div class="val" style="color:var(--mint)">+${r.xpGained}</div><div class="lbl">XP</div></div>
        <div class="statCard"><div class="icon">🪙</div><div class="val" style="color:var(--amber)">+${r.coinsGained}</div><div class="lbl">Монеты</div></div>
        <div class="statCard"><div class="icon">🔥</div><div class="val" style="color:var(--red)">${progress.streak}</div><div class="lbl">Серия</div></div>
      </div>

      ${r.maxCombo >= 3 ? `<div class="comboLine">Лучшее комбо: ${r.maxCombo} подряд 🔥</div>` : ""}

      <div class="spacer"></div>
      <button class="backBtn" id="homeBtn">На главную</button>
    </div>
  `;
  document.getElementById("homeBtn").addEventListener("click", () => { screen = "home"; render(); });
}

render();
</script>
</body>
</html>
